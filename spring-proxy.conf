server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # 1. Đường dẫn gốc / (Static Serve): Phục vụ trang web tĩnh thông tin học viên
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;

        # Cấu hình bộ nhớ đệm cho tài nguyên tĩnh
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Đường dẫn /api/ (Reverse Proxy): Định tuyến lưu lượng động đến Spring Boot backend
    location /api/ {
        # Chuyển tiếp yêu cầu đến ứng dụng Spring Boot chạy tại cổng 8082
        proxy_pass http://127.0.0.1:8082/;

        # Thiết lập các tiêu đề HTTP chuyển tiếp (Forwarding HTTP Headers)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cấu hình Timeout và Buffer chống nghẽn đường truyền
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Trang thông báo lỗi tiêu chuẩn
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
